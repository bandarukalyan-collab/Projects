[project]
name = "sdd-install-kit"
version = "2.1.0"
description = "Spec-Driven Development starter kit for Dell development teams"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Dell DevSecOps SDD Team" },
]

[project.urls]
Source = "https://gitlab.dell.com/ai-native-sdlc/sdd/pod-starter-kit"
Issues = "https://gitlab.dell.com/ai-native-sdlc/sdd/pod-starter-kit/-/issues"

[project.scripts]
sdd-install = "sdd_install_kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdd_install_kit"]

[tool.hatch.build.targets.wheel.force-include]
"dell-sdd" = "sdd_install_kit/harness"
"hooks_installer" = "sdd_install_kit/hooks_installer"
